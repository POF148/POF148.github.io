# -----------------------------------------------------------------------------
# Site settings
# -----------------------------------------------------------------------------

title: 魏啸峰 # the website title (if blank, full name will be used instead)
first_name: 啸峰
middle_name:
last_name: 魏
contact_note: >
  欢迎交流科研相关工作。
description: > # the ">" symbol means to ignore newlines until "footer_text:"
  魏啸峰，浙江师范大学，主要研究方向：流体力学、液滴动力学、多相流、微流控等。
footer_text: >
  Powered by <a href="https://jekyllrb.com/" target="_blank">Jekyll</a> with <a href="https://github.com/alshedivat/al-folio">al-folio</a> theme.
  Hosted by <a href="https://pages.github.com/" target="_blank">GitHub Pages</a>.

keywords: jekyll, academic-website, portfolio-website  # add your own keywords or leave empty
lang: cn # the language of your site (for example: en, fr, cn, ru, etc.)
icon: 🎓 # the emoji used as the favicon (alternatively, provide image name in /assets/img/)
apple_touch_icon: # image name in /assets/img/ (or a rooted path / absolute URL) used for iOS home-screen bookmarks; needs a real 180x180 PNG, since Safari ignores transparent images.

url: https://POF148.github.io # the base hostname & protocol for your site
baseurl: "" # the subpath of your site, e.g. /blog/. Leave blank for root
last_updated: false # set to true if you want to display last updated in the footer
impressum_path: # set to path to include impressum link in the footer, use the same path as permalink in a page, helps to conform with EU GDPR

# -----------------------------------------------------------------------------
# Theme
# -----------------------------------------------------------------------------

# code highlighter theme
highlight_theme: default # options: default, github, dracula, zenburn

# -----------------------------------------------------------------------------
# RSS Feed
# -----------------------------------------------------------------------------
# will use title and url fields
# Take a look to https://github.com/jekyll/jekyll-feed for customizations
rss_icon: false

# -----------------------------------------------------------------------------
# User preferences
# -----------------------------------------------------------------------------

# Enable or disable social media links on homepage
social: true

# -----------------------------------------------------------------------------
# Layout
# -----------------------------------------------------------------------------

# Show navigation bar
nav: true
nav_algo: false # if true, navigation bar will show algorithm pages

# -----------------------------------------------------------------------------
# Social integration
# -----------------------------------------------------------------------------
# 后面你可以按需再加邮箱、谷歌学术等，这里先空着
email:
scholar:
orcid:
github: POF148

# -----------------------------------------------------------------------------
# Comments
# -----------------------------------------------------------------------------
comments: false

# -----------------------------------------------------------------------------
# Analytics and search engine verification
# -----------------------------------------------------------------------------
google_analytics:
google_site_verification:

# -----------------------------------------------------------------------------
# Jekyll settings
# -----------------------------------------------------------------------------

# Markdown and syntax highlight
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: 'highlight'
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1

# Includes & excludes
include: ['_pages']
exclude:
  - bin
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - CNAME
keep_files:
  - .git
  - .gitignore

# -----------------------------------------------------------------------------
# Plugins
# -----------------------------------------------------------------------------
plugins:
update config 魏啸峰主页
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
